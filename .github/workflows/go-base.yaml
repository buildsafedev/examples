name: go-level-0

env:
  image_tag: v1
  REGISTRY: ttl.sh
  owner: buildsafedev
  final_image: go-level-0

on:
  push:

jobs:
  build_go_image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push_image.outputs.digest }}
    permissions:
      id-token: write
      packages: write
      contents: read
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Go image
        working-directory: ./golang-example
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.owner }}/${{ env.final_image }}:${{ env.image_tag }} .
      
      - name: Push and get digest
        id: push_image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.owner }}/${{ env.final_image }}:${{ env.image_tag }}
          digest=$(docker inspect ${{ env.REGISTRY }}/${{ env.owner }}/${{ env.final_image }}:${{ env.image_tag }} --format='{{index .RepoDigests 0}}' | cut -d'@' -f2)
          echo "digest=$digest" >> $GITHUB_OUTPUT

  # artifact:
  #   runs-on: ubuntu-latest
  #   needs: build_go_image
  #   permissions:
  #     id-token: write
  #     packages: write
  #     contents: read
  #     attestations: write
  #   steps:
  #     - name: Login to GitHub Container Registry
  #       uses: docker/login-action@v3
  #       with:
  #         registry: ttl.sh
  #         username: ${{ env.owner }}
  #         password: ${{ secrets.GITHUB_TOKEN }}
  #     - name: Attest image
  #       uses: actions/attest-build-provenance@v1
  #       with:
  #         subject-name: ${{ env.REGISTRY }}/${{ env.owner }}/${{ env.final_image }}
  #         subject-digest: ${{ needs.build_go_image.outputs.digest }}
  #         push-to-registry: true

  scan_image:
    needs: build_go_image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan image for vulnerabilities
        run: |
          grype ${{ env.REGISTRY }}/${{ env.owner }}/${{ env.final_image }}:${{ env.image_tag }} --only-fixed --fail-on low

  sign_image:
    needs: scan_image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: 'v2.4.1'

      - name: Sign and push image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          go_img_digest=$(docker manifest inspect ${{ env.REGISTRY }}/${{ env.owner }}/${{ env.final_image }}:${{ env.image_tag }} | jq -r '.config.digest')
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.owner }}/${{ env.final_image }}@${go_img_digest}